<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 7L57 27V51C57 54.9 53.9 58 50 58H14C10.1 58 7 54.9 7 51V27L32 7Z' fill='%23EDEEF0' stroke='%23EDEEF0' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='22.5' cy='38' r='7' fill='%235B8DFF'/%3E%3Ccircle cx='41.5' cy='38' r='7' fill='%2346C07D'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/xterm.css">
<style>
@font-face { font-family: "Geist"; src: url(/static/fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url(/static/fonts/GeistMono-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
/* Tokens: Figma "Agent desk — brand, system, app" → Design system (Color / Dimension / text styles) */
:root {
  color-scheme: dark;
  --canvas: #0F1012; --surface: #15171A; --raised: #1C1F23; --selected: #262A2F;
  --border: #24272C; --border-strong: #30343A;
  --t1: #EDEEF0; --t2: #A4A8AF; --t3: #6E737B; --on-primary: #0F1012;
  --primary: #EDEEF0; --primary-hover: #FFFFFF;
  --ok: #46C07D; --needs: #F2B544; --failed: #F0685A;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --sans: "Geist", "Inter", system-ui, sans-serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
  --inbox: 372px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); color: var(--t1); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--t2); outline-offset: 2px; }
::selection { background: rgba(91,141,255,.3); }
.ic { width: 16px; height: 16px; stroke-width: 2; flex: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.mono { font-family: var(--mono); }
kbd { font: 11px var(--mono); color: var(--t3); }

.app { display: grid; grid-template-columns: var(--inbox) minmax(0, 1fr); height: 100dvh; }

/* ---------- inbox ---------- */
.inbox { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.top { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px 20px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; letter-spacing: -.03em; }
.brand svg { width: 20px; height: 20px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid transparent; background: none; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--on-primary); } .btn.primary:hover { background: var(--primary-hover); }
.btn.secondary { background: var(--raised); border-color: var(--border-strong); } .btn.secondary:hover { background: var(--selected); }
.btn.quiet { color: var(--t2); } .btn.quiet:hover { background: var(--raised); color: var(--t1); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.top .btn { margin-left: auto; }
.list { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 0 12px 12px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.sec { display: flex; align-items: center; gap: 6px; padding: 14px 12px 6px; font-size: 11px; font-weight: 500; letter-spacing: .02em; color: var(--t3); }
.sec.alert { color: var(--needs); }
.sec button { margin-left: auto; border: 0; background: none; color: var(--t3); font: inherit; cursor: pointer; padding: 0; }
.sec button:hover { color: var(--t1); }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md); cursor: pointer; min-width: 0; }
.item:hover { background: var(--raised); }
.item[aria-selected="true"] { background: var(--selected); }
.item .sd { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sd.needs { background: var(--needs); } .sd.failed { background: var(--failed); } .sd.done { background: var(--t3); opacity: .6; }
.sd.todo { border: 1.5px solid var(--t3); }
.sd.live { animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 currentColor; } 70%, 100% { box-shadow: 0 0 0 5px transparent; } }
.sd.acc { background: var(--ac); color: color-mix(in srgb, var(--ac) 50%, transparent); }
.item .tx { flex: 1; min-width: 0; }
.item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .d { font-size: 12px; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.needs .d { color: var(--t2); } .item.done .t { color: var(--t2); }
.item .m { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--t3); flex: none; }
.item .m .dot { width: 6px; height: 6px; }
.none { padding: 4px 12px 6px; color: var(--t3); font-size: 12px; }
.usage { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px 20px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--t2); }
.usage span { display: inline-flex; align-items: center; gap: 6px; }
.usage b { font: 11px var(--mono); color: var(--t3); font-weight: 400; } .usage b.hot { color: var(--needs); }

/* ---------- pane ---------- */
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { display: flex; align-items: center; gap: 12px; padding: 22px 32px 18px; }
.head .ti { flex: 1; min-width: 0; }
.title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; border: 1px solid transparent; background: none; border-radius: var(--r-sm); padding: 1px 6px; margin-left: -7px; width: 100%; text-overflow: ellipsis; }
.title:hover { border-color: var(--border); } .title:focus { outline: none; border-color: var(--border-strong); background: var(--surface); }
.meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--t2); margin-top: 4px; flex-wrap: wrap; }
.meta .sep { color: var(--t3); } .meta .path { font: 11px var(--mono); color: var(--t3); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-needs { color: var(--needs); } .st-failed { color: var(--failed); } .st-muted { color: var(--t3); }
.ibtn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: var(--r-md); background: none; color: var(--t2); cursor: pointer; }
.ibtn:hover { background: var(--raised); color: var(--t1); }
.body { flex: 1; min-height: 0; overflow: auto; padding: 12px 32px; display: flex; flex-direction: column; gap: 20px; }
.col { width: min(100%, 680px); display: flex; flex-direction: column; gap: 12px; }
.label { font-size: 11px; font-weight: 500; letter-spacing: .02em; color: var(--t3); }
.label.alert { color: var(--needs); }
.ask { font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.peek { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-md); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.peek .ph { display: flex; align-items: center; gap: 8px; color: var(--t3); font-size: 11px; font-weight: 500; }
.peek .ph button { margin-left: auto; border: 0; background: none; color: var(--t3); font: 11px var(--mono); cursor: pointer; padding: 0; }
.peek .ph button:hover { color: var(--t1); }
.peek .ln { font: 12px/1.6 var(--mono); color: var(--t2); overflow-wrap: anywhere; }
.foot { padding: 0 32px 24px; }
.composer { width: min(100%, 680px); display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--r-md); padding: 8px 8px 8px 14px; }
.composer:focus-within { border-color: var(--t3); }
.composer textarea { flex: 1; border: 0; background: none; outline: none; resize: none; min-height: 22px; max-height: 200px; padding: 5px 0; line-height: 1.5; }
.hint { margin-top: 6px; font: 11px var(--mono); color: var(--t3); }
.send { width: 32px; height: 32px; border: 0; border-radius: var(--r-sm); background: var(--primary); color: var(--on-primary); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.send:hover { background: var(--primary-hover); } .send[disabled] { background: var(--raised); color: var(--t3); cursor: default; }
.mic { width: 32px; height: 32px; border: 0; border-radius: var(--r-sm); background: none; color: var(--t2); display: inline-grid; place-items: center; cursor: pointer; flex: none; position: relative; }
.mic:hover { background: var(--raised); color: var(--t1); }
.mic.rec { background: var(--failed); color: var(--on-primary); animation: recpulse 1.4s ease-out infinite; }
.mic.busy { color: var(--t3); cursor: progress; }
@keyframes recpulse { 0% { box-shadow: 0 0 0 0 rgba(240,104,90,.5); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.voice-note { font: 11px var(--mono); color: var(--failed); margin-top: 6px; }

/* terminal */
.term { flex: 1; min-height: 0; position: relative; border-top: 1px solid var(--border); }
.term #xt { position: absolute; inset: 10px 18px 12px 26px; }
.term .xterm-viewport { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.cover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15,16,18,.92); color: var(--t2); z-index: 2; }
.cover > div { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tmic { position: absolute; right: 22px; bottom: 16px; z-index: 3; background: var(--raised); border: 1px solid var(--border-strong); }
/* prompt queue: waits for the turn, or for the account's limit to reset */
.qwrap { padding: 8px 32px 4px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.qwrap:empty { display: none; }
.qwrap .composer { padding: 4px 4px 4px 12px; }
.qlist { display: flex; flex-direction: column; gap: 4px; width: min(100%, 680px); }
.qlist .qh { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; color: var(--t3); }
.qlist .qh button { margin-left: auto; border: 0; background: none; color: var(--t3); font-size: 11px; cursor: pointer; padding: 0; }
.qlist .qh button:hover { color: var(--t1); }
.qi { display: flex; align-items: flex-start; gap: 8px; padding: 6px 4px 6px 10px; border: 1px dashed var(--border-strong); border-radius: var(--r-sm); font-size: 13px; color: var(--t2); }
.qi .n { font: 11px var(--mono); color: var(--t3); padding-top: 2px; }
.qi .tx { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 4.5em; overflow: hidden; }
.qi .er { display: block; color: var(--failed); font-size: 11px; }
.qi button { width: 20px; height: 20px; display: inline-grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--t3); cursor: pointer; padding: 0; flex: none; }
.qi button:hover { background: var(--selected); color: var(--t1); } .qi button .ic { width: 12px; height: 12px; }
.tbar { display: flex; gap: 14px; white-space: nowrap; overflow: hidden; padding: 8px 32px 12px; font: 11px var(--mono); color: var(--t3); border-top: 1px solid var(--border); }

/* new task */
.new { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; overflow: auto; }
.new h1 { margin: 0; font-size: 18px; font-weight: 600; }
.bigbox { width: min(100%, 680px); position: relative; }
.bigbox textarea { width: 100%; min-height: 200px; resize: vertical; border: 1px solid var(--t3); background: var(--surface); border-radius: var(--r-lg); padding: 16px 52px 16px 18px; font-size: 16px; line-height: 1.55; outline: none; }
.bigbox .mic { position: absolute; top: 12px; right: 12px; }
.opts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-md); }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--t3); padding: 6px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--selected); color: var(--t1); }
.folder { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-md); padding: 0 12px; height: 38px; color: var(--t3); }
.folder input { border: 0; background: none; outline: none; font: 12px var(--mono); color: var(--t2); width: 260px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.err { color: var(--failed); font-size: 12px; } .err:empty { display: none; }

/* accounts + first run */
.accts { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; overflow: auto; min-height: 0; }
.accts h1 { margin: 0; font-size: 18px; font-weight: 600; flex: 1; }
.accts .lede { margin: 0; color: var(--t2); max-width: 640px; }
.alist { width: min(100%, 680px); display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
.arow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 14px 14px 14px 16px; }
.arow + .arow { border-top: 1px solid var(--border); }
.arow > .dot { width: 10px; height: 10px; margin-top: 8px; }
.arow .nm { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.arow .nm input { font-weight: 500; font-size: 14px; border: 1px solid transparent; background: none; border-radius: var(--r-sm); padding: 2px 6px; margin-left: -7px; field-sizing: content; min-width: 60px; max-width: 100%; }
.arow .nm input:hover { border-color: var(--border); } .arow .nm input:focus { outline: none; border-color: var(--border-strong); background: var(--canvas); }
.badge { font: 11px var(--mono); color: var(--t3); border: 1px solid var(--border-strong); border-radius: 99px; padding: 0 7px; }
.arow .sub { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--t3); min-width: 0; }
.arow .sub .em { color: var(--t2); } .arow .sub .bad { color: var(--failed); } .arow .sub .warn { color: var(--needs); }
.arow .dir { grid-column: 2; font: 11px var(--mono); color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .acts { grid-column: 3; grid-row: 1 / span 3; display: flex; gap: 4px; align-items: center; }
.arow .acts .btn { height: 28px; padding: 0 10px; font-size: 12px; }
.arow .acts .danger { color: var(--failed); } .arow .acts .danger.armed { background: var(--failed); color: var(--on-primary); }
.sw8 { grid-column: 2; display: flex; gap: 6px; padding-top: 4px; }
.sw8 button { width: 16px; height: 16px; border-radius: 50%; border: 0; cursor: pointer; padding: 0; outline-offset: 2px; }
.sw8 button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--t1); }
.addf { width: min(100%, 680px); display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px dashed var(--border-strong); border-radius: var(--r-md); }
.addf .row input[type=text] { height: 34px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--r-sm); padding: 0 10px; outline: none; width: 220px; }
.addf .row input[type=text]:focus { border-color: var(--t3); }
.addf .sw8 { padding: 0; }
.chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; } .chk input { margin-top: 3px; accent-color: var(--t1); }
.chk span { color: var(--t2); } .chk b { color: var(--t1); font-weight: 500; display: block; }
.lterm { width: min(100%, 760px); height: 300px; position: relative; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--canvas); flex: none; }
.lterm #xt { position: absolute; inset: 10px 12px; }
.mini { font: 11px var(--mono); color: var(--t3); }
.accts .row > svg { width: 28px; height: 28px; flex: none; }
@media (max-width: 820px) { .accts { padding: 20px 16px; } .arow { grid-template-columns: auto minmax(0, 1fr); } .arow .acts { grid-column: 2; grid-row: auto; flex-wrap: wrap; } .lterm { height: 340px; } }

/* empty */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
.empty svg { width: 56px; height: 56px; }
.empty h2 { margin: 0; font-size: 18px; font-weight: 600; }
.empty p { margin: 0; color: var(--t3); }

/* menu + toast */
.menu { position: fixed; z-index: 40; min-width: 210px; background: var(--raised); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--selected); } .menu button[disabled] { color: var(--t3); background: none; cursor: not-allowed; }
.menu .danger { color: var(--failed); } .menu .danger.armed { background: var(--failed); color: var(--on-primary); }
.menu hr { border: 0; border-top: 1px solid var(--border-strong); margin: 4px 2px; }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 50; pointer-events: none; }
.toast { background: var(--selected); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 9px 14px; font-size: 12px; max-width: 520px; }
.toast.err { border-color: var(--failed); color: var(--failed); }

/* account switch: chip, popover, pending badge (Figma "Account switch") */
.achip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 8px; border-radius: 99px; border: 1px solid var(--border-strong); background: var(--raised); color: var(--t2); font-size: 12px; font-weight: 500; cursor: pointer; }
.achip:hover, .achip[aria-expanded="true"] { background: var(--selected); color: var(--t1); }
.achip .ic { width: 12px; height: 12px; color: var(--t3); }
.pbadge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 3px 0 8px; border-radius: 99px; border: 1px dashed color-mix(in srgb, var(--ac) 55%, transparent); background: color-mix(in srgb, var(--ac) 12%, transparent); color: var(--t1); font-size: 12px; font-weight: 500; white-space: nowrap; min-width: 0; }
.pbadge > .ic { width: 12px; height: 12px; color: var(--ac); }
.pbadge .dot { width: 6px; height: 6px; background: var(--ac); }
.pbadge.err { border-color: var(--failed); background: color-mix(in srgb, var(--failed) 10%, transparent); }
.pbadge .lb { overflow: hidden; text-overflow: ellipsis; }
.pbadge button { width: 18px; height: 18px; display: inline-grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--t2); cursor: pointer; padding: 0; flex: none; }
.pbadge button:hover { background: var(--selected); color: var(--t1); } .pbadge button .ic { width: 12px; height: 12px; }
.bcard .pbadge { height: 20px; font-size: 11px; align-self: flex-start; max-width: 100%; margin-top: 2px; }
.accpop { position: fixed; z-index: 45; width: min(340px, calc(100vw - 24px)); background: var(--raised); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 2px; transform-origin: top left; animation: popin .14s ease-out; }
@keyframes popin { from { opacity: 0; transform: scale(.96); } }
.accpop .ph { padding: 8px 10px 4px; font-size: 11px; font-weight: 500; color: var(--t3); }
.accpop .opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; text-align: left; min-width: 0; }
.accpop .opt:hover, .accpop .opt[aria-checked="true"].pick { background: var(--selected); }
.accpop .opt .dot { width: 8px; height: 8px; }
.accpop .opt .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.accpop .opt .tx b { font-weight: 500; } .accpop .opt .tx span { font-size: 11px; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.accpop .opt .u { font: 11px var(--mono); color: var(--t3); flex: none; } .accpop .opt .u .hot { color: var(--needs); }
.accpop .opt .ck { width: 14px; height: 14px; flex: none; color: var(--t1); }
.accpop .opt .q { font: 10px var(--mono); color: var(--t3); border: 1px dashed var(--border-strong); border-radius: 99px; padding: 0 6px; flex: none; }
.accpop hr { border: 0; border-top: 1px solid var(--border-strong); margin: 2px 0; }
.accpop .note { padding: 6px 10px 8px; font-size: 11px; color: var(--t3); }
.accpop .when { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; text-align: left; }
.accpop .when:hover { background: color-mix(in srgb, var(--selected) 60%, transparent); }
.accpop .when[aria-checked="true"] { background: var(--selected); }
.accpop .when .rd { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border-strong); flex: none; margin-top: 3px; }
.accpop .when[aria-checked="true"] .rd { border: 4px solid var(--t1); }
.accpop .when b { display: block; font-weight: 500; color: var(--t1); } .accpop .when .sub { font-size: 11px; color: var(--t3); }

const TOKEN = "__CAGENTS_TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const MARK = (b = "#EDEEF0", l = "#5B8DFF", r = "#46C07D") => `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 7L57 27V51C57 54.9 53.9 58 50 58H14C10.1 58 7 54.9 7 51V27L32 7Z" fill="${b}" stroke="${b}" stroke-width="4" stroke-linejoin="round"/><circle cx="22.5" cy="38" r="7" fill="${l}"/><circle cx="41.5" cy="38" r="7" fill="${r}"/></svg>`;

let S = { cards: [], usage: {}, dirs: [], voice: false }, loaded = false;
let acct = store.get("loft.acct") || "";            // "" = all accounts, else an account id
let sel = new URL(location.href).searchParams.get("a") || null;   // card id | "new" | null
let showDone = false, termView = {}, brView = {}, prevNeeds = null, drafts = {};
let newAcct = store.get("loft.newAcct") || "";
let AC = null, adding = false, loginFor = null, loginEnded = false;    // accounts screen: listing, add form open, account signing in
let view = new URL(location.href).searchParams.get("v") || store.get("loft.view") || "inbox";   // inbox | board
let dragId = null, boardStale = false, startingIds = new Set();
const jget = (k, d) => { try { return JSON.parse(store.get(k) || "null") ?? d; } catch { return d; } };

let fsel = jget("loft.fsel", {});                     // per dimension: the selected value ("" = Unsorted / Other); absent = All

let newProj = null, PE = null, orgPick = null, orgFolders = null;

/* ---------- helpers ---------- */
// Loft restarted with a different token: reload once to pick up the new one
// (at most every 10 s, so a server that keeps refusing can't loop the page).
// The live stream closed for good: wait until Loft answers, then reload (never reload into a dead server).
function waitForLoft() {
  fetch("/api/ping", { headers: { "X-Cagents-Token": TOKEN } })
    .then(r => r.status === 403 ? staleToken() : location.reload())
    .catch(() => setTimeout(waitForLoft, 3000));
}
function staleToken() {
  let last = 0;
  try { last = +sessionStorage.getItem("loft.reloadAt") || 0; } catch (e) {}
  if (Date.now() - last < 10000) return;
  try { sessionStorage.setItem("loft.reloadAt", String(Date.now())); } catch (e) {}
  location.reload();
}
async function api(path, body, raw) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "X-Cagents-Token": TOKEN, "Content-Type": raw ? raw : "application/json" }, body: body ? (raw ? body : JSON.stringify(body)) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403 && j.error === "bad token") staleToken();
  if (!r.ok) throw new Error(j.message || j.error || r.statusText);
  return j;
}
async function apiM(method, path, body) {
  const r = await fetch(path, { method, headers: { "X-Cagents-Token": TOKEN, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403 && j.error === "bad token") staleToken();
  if (!r.ok) throw new Error(j.message || j.error || r.statusText);
  return j;
}
function toast(m, err) { if (!m) return; const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = m; $("#toasts").append(t); setTimeout(() => t.remove(), err ? 6000 : 2600); }
async function act(id, a, body = {}, quiet) { try { const r = await api(`/api/cards/${id}/${a}`, body); if (!quiet) toast(r.message); return r; } catch (e) { toast(e.message, true); return null; } }
function ago(iso) { if (!iso) return ""; const s = (Date.now() - Date.parse(iso)) / 1000; if (s < 60) return "now"; for (const [u, n] of [["d", 86400], ["h", 3600], ["m", 60]]) if (s >= n) return Math.floor(s / n) + u; }
const icons = () => lucide.createIcons({ attrs: { class: "ic" } });
const statusOf = c => c.failed ? "failed" : c.col;
const OTHER = { id: null, label: "Other login", hex: "#6E737B", email: "" };
const accById = id => (S.accounts || []).find(a => a.id === id);
const accOf = c => accById(c.account) || OTHER;
const accTitle = a => a.label + (a.email ? " · " + a.email : "");
const dotH = (a, cls = "") => `<span class="dot ${cls}" style="background:${a.hex}" title="${esc(accTitle(a))}"></span>`;
const accColor = c => `style="color:${accOf(c).hex}"`;

function gb() { const g = groupBy || S.groupBy || "status"; return GROUPS.some(([k]) => k === g) && (g !== "account" || multiAcc()) ? g : "status"; }
const projById = id => (S.projects || []).find(p => p.id === id);
const projOf = c => projById(c.project) || null;
const GREY = "#6E737B";
const repoOf = c => (c.folder || c.cwd || "").replace(/\/\.claude\/worktrees\/.*$/, "");
// Every folder a project covers: its own, the repos its agents work in, recent ones inside its folders.
const projDirs = pj => [...new Set([...pj.folders, ...S.cards.filter(c => c.project === pj.id).map(repoOf),

function curFilter(g = gb()) { const f = fsel[g]; return f !== undefined && dimValues(g, S.cards).some(d => d.key === f) ? f : undefined; }

function cycleGroup() { const o = groupOpts().map(([k]) => k); setGroup(o[(o.indexOf(gb()) + 1) % o.length]); toast("Group by " + gb()); }
const SVG = { chev: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`,
  rows: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18"/><path d="M3 12h18"/><path d="M3 19h18"/></svg>`,
  check: `<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>` };
const groupLabel = () => (GROUPS.find(([k]) => k === gb()) || [, "Status"])[1];

  };

      h += `<div class="sec"><span class="dot" style="background:${d.hex}"></span><span class="gl" title="${esc(d.title)}">${esc(d.label)}${u}</span><span>${l.length}</span>${nn ? `<span class="nn">${nn} needs you</span>` : ""}</div>`

  if (run.length) h += sec("Working", run) + run.map(item).join("");

  if (done.length) h += sec("Done", done, "", `${archAllBtn(done)}<button data-toggle-done>${showDone ? "Hide" : "Show"}</button>`) + (showDone ? done.slice(0, 30).map(item).join("") : "");
  $("#list").innerHTML = h;
  $("#usage").innerHTML = usageHTML();
}
function filterOpts() {   // {dim, cur, all, vals: [{key, label, hex, title, n}]} for the active grouping, or null when there is nothing to choose
  const g = gb();
  if (LANED.includes(g)) {
    const n = k => S.cards.filter(c => keyOf(c, g) === k).length;
    const cur = curFilter(g), vals = dimValues(g, S.cards).map(d => ({ ...d, n: n(d.key) })).filter(d => d.n || d.key === cur);
    return { dim: g, cur, all: S.cards.length, vals };
  }
  const accs = S.accounts || []; if (accs.length < 2) return null;
  return { dim: "account-filter", cur: accById(acct) ? acct : undefined, all: S.cards.length,
    vals: accs.map(a => ({ key: a.id, label: a.label, hex: a.hex, title: accTitle(a), n: S.cards.filter(c => c.account === a.id).length })) };
}
function filtersHTML() {

}
function openDD(btn, kind, kb) {
  const m = $("#menu"), item = (attrs, on, inner) => `<button role="menuitemradio" aria-checked="${on}" ${attrs}>${inner}${on ? SVG.check : ""}</button>`;
  if (kind === "group") m.innerHTML = `<div class="mlabel">Group by</div>${groupOpts().map(([k, l]) => item(`data-group="${k}"`, gb() === k, `<span class="ddm-v">${l}</span>`)).join("")}<div class="mfoot">g cycles</div>`;
  else { const o = filterOpts(); if (!o) return; const attr = k => o.dim === "account-filter" ? `data-acct="${esc(k)}"` : `data-fkey="${esc(k)}"`;
    m.innerHTML = `<div class="mlabel">Show</div>${item(attr(o.dim === "account-filter" ? "" : "*"), o.cur === undefined, `<span class="dot" style="background:transparent"></span><span class="ddm-v">All</span><span class="ddm-n">${o.all}</span>`)}${o.vals.map(d =>
      item(`${attr(d.key)} title="${esc(d.title)}"`, o.cur === d.key, `<span class="dot" style="background:${d.hex}"></span><span class="ddm-v">${esc(d.label)}</span><span class="ddm-n">${d.n}</span>`)).join("")}`; }

/* ---------- board ---------- */
const BCOLS = [["todo", "Todo"], ["running", "Working"], ["needs", "Needs you"], ["done", "Done"]];

function boardCols(v = visible()) {

  const EMPTY = { todo: ["No todos", "Press N to write one, or save a task to Todo."], running: ["Nothing running", "Drag a todo here to start it."],

  $("#cols").innerHTML = BCOLS.map(([k, l]) => {

}
function lanesHTML(g, card) {

  let h = `<div class="lhead">${BCOLS.map(([k, l]) => { const n = k === "done" ? totals.doneAll : totals[k].length, al = k === "needs" && n;

  for (const d of dimValues(g, v)) {
    const l = v.filter(c => keyOf(c, g) === d.key); if (!l.length) continue;
    const cols = boardCols(l), nn = cols.needs.length, lk = g + ":" + d.key, shut = lanesShut.has(lk), p = g === "project" ? projById(d.key) : null;

/* ---------- voice ---------- */
let rec = null, recTarget = null, chunks = [];
async function toggleVoice(target) {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  if (!S.voice) return toast("Voice isn't set up on this machine.", true);
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { return toast("Microphone blocked. Allow it for this window and try again.", true); }
  recTarget = target; chunks = [];
  rec = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); setMic("busy"); note("Transcribing…");
    try {
      const blob = new Blob(chunks, { type: "audio/webm" });
      if (blob.size < 2000) throw new Error("Didn't catch that — hold on a little longer.");
      const { text } = await api("/api/voice", blob, "audio/webm");
      if (!text) throw new Error("Didn't catch any words.");
      deliver(recTarget, text);
    } catch (e) { toast(e.message, true); }
    finally { setMic(""); note(""); rec = null; }
  };
  rec.start(); setMic("rec"); note("Listening… press V or click the mic to stop");
}
function setMic(state) { document.querySelectorAll(`[data-mic]`).forEach(b => { b.classList.toggle("rec", state === "rec"); b.classList.toggle("busy", state === "busy"); }); }

function deliver(target, text) {
  const go = /[,.]?\s*(start it|send it|go ahead and send( it)?)[.!]?$/i;
  const auto = go.test(text); if (auto) text = text.replace(go, "").trim();
  if (target === "term") { paste(text); term?.focus(); return; }
  const el = $("#" + target); if (!el) return;
  el.value = (el.value.trim() ? el.value.trimEnd() + " " : "") + text; el.dispatchEvent(new Event("input", { bubbles: true })); grow(el); el.focus();
  if (auto) { if (target === "atext") asSend(); else if (target === "nprompt") submitNew(true); else if (target === "reply") sendReply(); else if (target === "tprompt") $("[data-start]")?.click(); }
}
function voiceTarget() { if (sel === "new") return "nprompt"; if (sel === "assistant") return "atext"; if ($("#reply")) return "reply"; if ($("#tprompt")) return "tprompt"; if ($("#xt")) return "term"; return null; }

/* ---------- actions ---------- */
async function sendReply(text) {
  const c = cardOf(sel); const box = $("#reply"); text = (text ?? box?.value ?? "").trim(); if (!c || !text) return;
  // Optimistic: clear now (sending takes a few seconds), put the text back if it fails.
  drafts[c.id] = ""; if (box) { box.value = ""; grow(box); }
  toast(`Sending to ${c.name}…`);
  const r = await act(c.id, "reply", { text }, true);
  if (!r) { drafts[c.id] = text; const b2 = $("#reply"); if (b2 && sel === c.id) { b2.value = text; grow(b2); } return; }
  if (r.message !== "Sent") { toast(r.message); try { apply(await api("/api/state")); } catch {} return; }   // queued: stay on it
  toast(`Sent to ${c.name}`);
  if (sel === c.id) { const next = needsList().find(x => x.id !== c.id); if (next) setSel(next.id); }
}

  if (!cwd) { $("#nerr").textContent = "Pick the project folder it works in."; $("#ndir").focus(); return; }

// One long-lived session that operates Loft (POST /api/assistant). Its card is hidden from the
// lists; the conversation is read with the chat API (/api/cards/<id>/messages).
const AS = { id: null, card: null, items: [], cursor: 0, session: null, timer: null, local: [], waiting: false, working: false, pending: null, shape: null };
const AS_CHIPS = [["Archive everything that's done", true], ["Stop all running agents", true], ["What needs me?", true], ["Start a task…", false]];
function strip(s) { const a = (s.cards || []).find(c => c.assistant); AS.card = a || null; if (a && !AS.id) AS.id = a.id; return { ...s, cards: (s.cards || []).filter(c => !c.assistant) }; }
function md(src) {   // small, safe markdown: fences, headings, lists, tables, inline code, bold, italics, links
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = [], lines = String(src || "").replace(/\r/g, "").split("\n");
  const block = /^(```|#{1,3}\s|\s*([-*+]|\d+[.)])\s|\|)/;
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
    const h = /^(#{1,3})\s+(.*)/.exec(l); if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) { const ol = /^\s*\d/.test(l), items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
      out.push(`<${ol ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ol ? "ol" : "ul"}>`); continue; }
    if (/^\|.*\|\s*$/.test(l)) { const rows = []; while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().slice(1, -1).split("|").map(x => x.trim()); const body = rows.filter(r => !/^\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table>${body.map((r, n) => `<tr>${cells(r).map(x => n ? `<td>${inline(x)}</td>` : `<th>${inline(x)}</th>`).join("")}</tr>`).join("")}</table>`); continue; }
    if (!l.trim()) { i++; continue; }
    const para = [lines[i++]]; while (i < lines.length && lines[i].trim() && !block.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}
