<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 7L57 27V51C57 54.9 53.9 58 50 58H14C10.1 58 7 54.9 7 51V27L32 7Z' fill='%23EDEEF0' stroke='%23EDEEF0' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='22.5' cy='38' r='7' fill='%235B8DFF'/%3E%3Ccircle cx='41.5' cy='38' r='7' fill='%2346C07D'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/xterm.css">
<style>
@font-face { font-family: "Geist"; src: url(/static/fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url(/static/fonts/GeistMono-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
/* Tokens: Figma "Agent desk — brand, system, app" → Design system (Color / Dimension / text styles) */
:root {
  color-scheme: dark;
  --canvas: #0F1012; --surface: #15171A; --raised: #1C1F23; --selected: #262A2F;
  --border: #24272C; --border-strong: #30343A;
  --t1: #EDEEF0; --t2: #A4A8AF; --t3: #6E737B; --on-primary: #0F1012;
  --primary: #EDEEF0; --primary-hover: #FFFFFF;
  --work: #5B8DFF; --pers: #46C07D; --needs: #F2B544; --failed: #F0685A;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --sans: "Geist", "Inter", system-ui, sans-serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
  --inbox: 372px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); color: var(--t1); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--t2); outline-offset: 2px; }
::selection { background: rgba(91,141,255,.3); }
.ic { width: 16px; height: 16px; stroke-width: 2; flex: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.dot.work { background: var(--work); } .dot.pers { background: var(--pers); }
.mono { font-family: var(--mono); }
kbd { font: 11px var(--mono); color: var(--t3); }

.app { display: grid; grid-template-columns: var(--inbox) minmax(0, 1fr); height: 100dvh; }

/* ---------- inbox ---------- */
.inbox { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.top { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px 20px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; letter-spacing: -.03em; }
.brand svg { width: 20px; height: 20px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid transparent; background: none; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--on-primary); } .btn.primary:hover { background: var(--primary-hover); }
.btn.secondary { background: var(--raised); border-color: var(--border-strong); } .btn.secondary:hover { background: var(--selected); }
.btn.quiet { color: var(--t2); } .btn.quiet:hover { background: var(--raised); color: var(--t1); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.top .btn { margin-left: auto; }
.filters { display: flex; gap: 2px; padding: 0 12px 6px; }
.filters button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--t3); padding: 5px 10px; border-radius: 99px; cursor: pointer; font-size: 12px; }
.filters button:hover { color: var(--t1); }
.filters button[aria-pressed="true"] { background: var(--selected); color: var(--t1); }
.list { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 0 12px 12px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.sec { display: flex; align-items: center; gap: 6px; padding: 14px 12px 6px; font-size: 11px; font-weight: 500; letter-spacing: .02em; color: var(--t3); }
.sec.alert { color: var(--needs); }
.sec button { margin-left: auto; border: 0; background: none; color: var(--t3); font: inherit; cursor: pointer; padding: 0; }
.sec button:hover { color: var(--t1); }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md); cursor: pointer; min-width: 0; }
.item:hover { background: var(--raised); }
.item[aria-selected="true"] { background: var(--selected); }
.item .sd { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sd.needs { background: var(--needs); } .sd.failed { background: var(--failed); } .sd.done { background: var(--t3); opacity: .6; }
.sd.todo { border: 1.5px solid var(--t3); } .sd.work { background: var(--work); } .sd.pers { background: var(--pers); }
.sd.live { animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 currentColor; } 70%, 100% { box-shadow: 0 0 0 5px transparent; } }
.sd.work.live { color: rgba(91,141,255,.5); } .sd.pers.live { color: rgba(70,192,125,.5); }
.item .tx { flex: 1; min-width: 0; }
.item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .d { font-size: 12px; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.needs .d { color: var(--t2); } .item.done .t { color: var(--t2); }
.item .m { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--t3); flex: none; }
.item .m .dot { width: 6px; height: 6px; }
.none { padding: 4px 12px 6px; color: var(--t3); font-size: 12px; }
.usage { display: flex; gap: 16px; padding: 12px 20px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--t2); }
.usage span { display: inline-flex; align-items: center; gap: 6px; }
.usage b { font: 11px var(--mono); color: var(--t3); font-weight: 400; } .usage b.hot { color: var(--needs); }

/* ---------- pane ---------- */
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { display: flex; align-items: center; gap: 12px; padding: 22px 32px 18px; }
.head .ti { flex: 1; min-width: 0; }
.title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; border: 1px solid transparent; background: none; border-radius: var(--r-sm); padding: 1px 6px; margin-left: -7px; width: 100%; text-overflow: ellipsis; }
.title:hover { border-color: var(--border); } .title:focus { outline: none; border-color: var(--border-strong); background: var(--surface); }
.meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--t2); margin-top: 4px; flex-wrap: wrap; }
.meta .sep { color: var(--t3); } .meta .path { font: 11px var(--mono); color: var(--t3); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-needs { color: var(--needs); } .st-failed { color: var(--failed); } .st-work { color: var(--work); } .st-pers { color: var(--pers); } .st-muted { color: var(--t3); }
.ibtn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: var(--r-md); background: none; color: var(--t2); cursor: pointer; }
.ibtn:hover { background: var(--raised); color: var(--t1); }
.body { flex: 1; min-height: 0; overflow: auto; padding: 12px 32px; display: flex; flex-direction: column; gap: 20px; }
.col { width: min(100%, 680px); display: flex; flex-direction: column; gap: 12px; }
.label { font-size: 11px; font-weight: 500; letter-spacing: .02em; color: var(--t3); }
.label.alert { color: var(--needs); }
.ask { font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.peek { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-md); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.peek .ph { display: flex; align-items: center; gap: 8px; color: var(--t3); font-size: 11px; font-weight: 500; }
.peek .ph button { margin-left: auto; border: 0; background: none; color: var(--t3); font: 11px var(--mono); cursor: pointer; padding: 0; }
.peek .ph button:hover { color: var(--t1); }
.peek .ln { font: 12px/1.6 var(--mono); color: var(--t2); overflow-wrap: anywhere; }
.foot { padding: 0 32px 24px; }
.composer { width: min(100%, 680px); display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--r-md); padding: 8px 8px 8px 14px; }
.composer:focus-within { border-color: var(--t3); }
.composer textarea { flex: 1; border: 0; background: none; outline: none; resize: none; min-height: 22px; max-height: 200px; padding: 5px 0; line-height: 1.5; }
.hint { margin-top: 6px; font: 11px var(--mono); color: var(--t3); }
.send { width: 32px; height: 32px; border: 0; border-radius: var(--r-sm); background: var(--primary); color: var(--on-primary); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.send:hover { background: var(--primary-hover); } .send[disabled] { background: var(--raised); color: var(--t3); cursor: default; }
.mic { width: 32px; height: 32px; border: 0; border-radius: var(--r-sm); background: none; color: var(--t2); display: inline-grid; place-items: center; cursor: pointer; flex: none; position: relative; }
.mic:hover { background: var(--raised); color: var(--t1); }
.mic.rec { background: var(--failed); color: var(--on-primary); animation: recpulse 1.4s ease-out infinite; }
.mic.busy { color: var(--t3); cursor: progress; }
@keyframes recpulse { 0% { box-shadow: 0 0 0 0 rgba(240,104,90,.5); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.voice-note { font: 11px var(--mono); color: var(--failed); margin-top: 6px; }

/* terminal */
.term { flex: 1; min-height: 0; position: relative; border-top: 1px solid var(--border); }
.term #xt { position: absolute; inset: 10px 18px 12px 26px; }
.term .xterm-viewport { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.cover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15,16,18,.92); color: var(--t2); z-index: 2; }
.cover > div { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tmic { position: absolute; right: 22px; bottom: 16px; z-index: 3; background: var(--raised); border: 1px solid var(--border-strong); }
.tbar { display: flex; gap: 14px; white-space: nowrap; overflow: hidden; padding: 8px 32px 12px; font: 11px var(--mono); color: var(--t3); border-top: 1px solid var(--border); }

/* new task */
.new { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; overflow: auto; }
.new h1 { margin: 0; font-size: 18px; font-weight: 600; }
.bigbox { width: min(100%, 680px); position: relative; }
.bigbox textarea { width: 100%; min-height: 200px; resize: vertical; border: 1px solid var(--t3); background: var(--surface); border-radius: var(--r-lg); padding: 16px 52px 16px 18px; font-size: 16px; line-height: 1.55; outline: none; }
.bigbox .mic { position: absolute; top: 12px; right: 12px; }
.opts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-md); }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--t3); padding: 6px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--selected); color: var(--t1); }
.folder { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-md); padding: 0 12px; height: 38px; color: var(--t3); }
.folder input { border: 0; background: none; outline: none; font: 12px var(--mono); color: var(--t2); width: 260px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.err { color: var(--failed); font-size: 12px; } .err:empty { display: none; }

/* empty */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
.empty svg { width: 56px; height: 56px; }
.empty h2 { margin: 0; font-size: 18px; font-weight: 600; }
.empty p { margin: 0; color: var(--t3); }

/* menu + toast */
.menu { position: fixed; z-index: 40; min-width: 210px; background: var(--raised); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--selected); } .menu button[disabled] { color: var(--t3); background: none; cursor: not-allowed; }
.menu .danger { color: var(--failed); } .menu .danger.armed { background: var(--failed); color: var(--on-primary); }
.menu hr { border: 0; border-top: 1px solid var(--border-strong); margin: 4px 2px; }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 50; pointer-events: none; }
.toast { background: var(--selected); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 9px 14px; font-size: 12px; max-width: 520px; }
.toast.err { border-color: var(--failed); color: var(--failed); }

.back { display: none !important; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .app.open .inbox { display: none; } .app:not(.open) .pane { display: none; }
  .head, .body, .foot, .new, .tbar { padding-left: 16px; padding-right: 16px; }
  .back { display: inline-grid !important; }
}
@media (prefers-reduced-motion: reduce) { .sd.live, .mic.rec { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="inbox" aria-label="Agents">
    <div class="top">
      <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 7L57 27V51C57 54.9 53.9 58 50 58H14C10.1 58 7 54.9 7 51V27L32 7Z" fill="#EDEEF0" stroke="#EDEEF0" stroke-width="4" stroke-linejoin="round"/><circle cx="22.5" cy="38" r="7" fill="#5B8DFF"/><circle cx="41.5" cy="38" r="7" fill="#46C07D"/></svg>loft</div>
      <button class="btn primary" id="newBtn" title="New task (N)"><i data-lucide="plus" class="ic"></i>New</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Account"></div>
    <div class="list" id="list"></div>
    <div class="usage" id="usage"></div>
  </aside>
  <main class="pane" id="pane"></main>
</div>
<div class="menu" id="menu" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/lucide.min.js"></script>
<script src="/static/xterm.js"></script>
<script src="/static/addon-fit.js"></script>
<script>
const TOKEN = "__CAGENTS_TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const MARK = (b = "#EDEEF0", l = "#5B8DFF", r = "#46C07D") => `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 7L57 27V51C57 54.9 53.9 58 50 58H14C10.1 58 7 54.9 7 51V27L32 7Z" fill="${b}" stroke="${b}" stroke-width="4" stroke-linejoin="round"/><circle cx="22.5" cy="38" r="7" fill="${l}"/><circle cx="41.5" cy="38" r="7" fill="${r}"/></svg>`;

let S = { cards: [], usage: {}, dirs: [], voice: false }, loaded = false;
let acct = store.get("loft.acct") || "";            // "" | work | personal
let sel = new URL(location.href).searchParams.get("a") || null;   // card id | "new" | null
let showDone = false, termView = {}, prevNeeds = null, drafts = {};
let newAcct = store.get("loft.newAcct") || "work";

/* ---------- helpers ---------- */
async function api(path, body, raw) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "X-Cagents-Token": TOKEN, "Content-Type": raw ? raw : "application/json" }, body: body ? (raw ? body : JSON.stringify(body)) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || j.error || r.statusText);
  return j;
}
function toast(m, err) { if (!m) return; const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = m; $("#toasts").append(t); setTimeout(() => t.remove(), err ? 6000 : 2600); }
async function act(id, a, body = {}, quiet) { try { const r = await api(`/api/cards/${id}/${a}`, body); if (!quiet) toast(r.message); return r; } catch (e) { toast(e.message, true); return null; } }
function ago(iso) { if (!iso) return ""; const s = (Date.now() - Date.parse(iso)) / 1000; if (s < 60) return "now"; for (const [u, n] of [["d", 86400], ["h", 3600], ["m", 60]]) if (s >= n) return Math.floor(s / n) + u; }
const icons = () => lucide.createIcons({ attrs: { class: "ic" } });
const statusOf = c => c.failed ? "failed" : c.col;
const acctCls = c => c.work ? "work" : "pers";
const visible = () => S.cards.filter(c => !acct || (acct === "work") === c.work);
const byTime = l => l.slice().sort((a, b) => (b.pinned - a.pinned) || (Date.parse(b.updated || 0) - Date.parse(a.updated || 0)));
const needsList = () => byTime(visible().filter(c => c.col === "needs"));
const cardOf = id => S.cards.find(c => c.id === id);
const noPrompt = c => !c.detail || c.detail === "(no prompt yet)";
function setSel(id) { sel = id; const u = new URL(location.href); id ? u.searchParams.set("a", id) : u.searchParams.delete("a"); history.replaceState(null, "", u); render(); }

/* ---------- inbox ---------- */
function renderInbox() {
  $("#filters").innerHTML = [["", "All"], ["work", "Work"], ["personal", "Personal"]].map(([k, l]) =>
    `<button data-acct="${k}" aria-pressed="${acct === k}">${k ? `<span class="dot ${k === "work" ? "work" : "pers"}"></span>` : ""}${l}</button>`).join("");
  const v = visible(), by = k => byTime(v.filter(c => c.col === k));
  const item = c => {
    const s = statusOf(c), dotCls = s === "running" ? `${acctCls(c)} live` : s;
    const d = c.kind === "todo" ? (noPrompt(c) ? "Not started" : c.detail) : (c.col === "done" && c.result ? c.result : c.detail) || "";
    return `<div class="item ${s}" role="option" tabindex="0" data-id="${esc(c.id)}" aria-selected="${c.id === sel}">
      <span class="sd ${dotCls}" title="${{ needs: "Needs you", running: "Working", todo: "Todo", done: "Done", failed: "Failed" }[s]}"></span>
      <div class="tx"><div class="t">${esc(c.name)}</div><div class="d">${esc(d)}</div></div>
      <div class="m">${ago(c.updated)}<span class="dot ${acctCls(c)}" title="${c.work ? "Work · Ritchie" : "Personal · lucerocris"}"></span></div></div>`;
  };
  const sec = (label, list, cls, extra = "") => `<div class="sec ${cls || ""}">${label} <span>${list.length}</span>${extra}</div>`;
  const needs = by("needs"), run = by("running"), todo = by("todo"), done = by("done");
  let h = sec("Needs you", needs, needs.length ? "alert" : "") + (needs.length ? needs.map(item).join("") : `<div class="none">Nothing waiting on you</div>`);
  if (run.length) h += sec("Working", run) + run.map(item).join("");
  if (todo.length) h += sec("Todo", todo) + todo.map(item).join("");
  if (done.length) h += sec("Done", done, "", `<button data-toggle-done>${showDone ? "Hide" : "Show"}</button>`) + (showDone ? done.slice(0, 30).map(item).join("") : "");
  $("#list").innerHTML = h;
  const u = S.usage || {}, num = x => x && x !== "—" && !isNaN(+x) ? +x : null;
  $("#usage").innerHTML = [["work", "Work"], ["personal", "Personal"]].map(([k, l]) => {
    const w = num(u[k]?.seven), f = num(u[k]?.five); const parts = [f != null ? `5h ${f}%` : "", w != null ? `7d ${w}%` : ""].filter(Boolean).join(" · ");
    return `<span><span class="dot ${k === "work" ? "work" : "pers"}"></span>${l}<b class="${Math.max(w || 0, f || 0) >= 85 ? "hot" : ""}">${parts || "—"}</b></span>`;
  }).join("");
}

/* ---------- pane ---------- */
let term = null, fit = null, ws = null, wsFor = null;
function paneKey(c) { return c ? [c.id, statusOf(c), c.name, c.work, !!termView[c.id], c.kind].join("|") : sel || "none"; }
function renderPane() {
  const p = $("#pane"); let c = sel && sel !== "new" ? cardOf(sel) : null;
  if (sel && sel !== "new" && !c && loaded) { sel = null; }
  if (!sel && loaded) { const n = needsList()[0]; if (n) { sel = n.id; c = n; } }
  $("#app").classList.toggle("open", !!sel);
  const key = sel === "new" ? "new" : paneKey(c);
  if (p.dataset.key === key) { if (c) refreshPane(c); return; }   // keep typing / terminal alive
  p.dataset.key = key;
  if (sel !== "new" && (!c || c.kind === "todo" || !(c.col !== "needs" || termView[c.id]))) disconnectTerm();
  if (sel === "new") return paneNew(p);
  if (!c) return paneQuiet(p);
  if (c.kind === "todo") return paneTodo(p, c);
  if (c.col === "needs" && !termView[c.id]) return paneAsk(p, c);
  return paneTerm(p, c);
}
function head(c, actions = true) {
  const s = statusOf(c);
  const st = { needs: ["Needs you", "st-needs"], running: ["Working", c.work ? "st-work" : "st-pers"], todo: ["Todo", "st-muted"], done: ["Done", "st-muted"], failed: ["Failed", "st-failed"] }[s];
  const proj = c.project === "~" ? "home" : c.project;
  return `<div class="head"><button class="ibtn back" data-back aria-label="Back"><i data-lucide="arrow-left" class="ic"></i></button>
    <div class="ti"><label class="sr-only" hidden for="title">Name</label><input class="title" id="title" value="${esc(c.name)}" spellcheck="false" title="Click to rename">
    <div class="meta"><span class="dot ${acctCls(c)}"></span>${c.work ? "Work" : "Personal"}<span class="sep">·</span><span class="path">${esc(proj)}</span><span class="sep">·</span><span class="${st[1]}" id="stLabel">${st[0]}</span><span class="sep">·</span><span class="st-muted" id="agoLabel">${ago(c.updated)}</span></div></div>
    ${actions && c.col === "needs" ? `<button class="btn quiet" data-toggle-term title="Switch view (T)"><i data-lucide="${termView[c.id] ? "message-square" : "square-terminal"}" class="ic"></i>${termView[c.id] ? "Question" : "Terminal"}</button>` : ""}
    <button class="ibtn" data-menu aria-label="More actions" title="More"><i data-lucide="ellipsis" class="ic"></i></button></div>`;
}
const micBtn = (target, cls = "") => S.voice ? `<button class="mic ${cls}" data-mic="${target}" title="Speak (V)" aria-label="Speak"><i data-lucide="mic" class="ic"></i></button>` : "";
function paneAsk(p, c) {
  p.innerHTML = `${head(c)}
    <div class="body"><div class="col">
      <div class="label alert">It's asking</div>
      <div class="ask" id="askText">${esc(c.detail || "It stopped and is waiting for you.")}</div>
      <div class="chips"><button class="btn secondary" data-quick="Yes, go ahead.">Yes, go ahead</button><button class="btn secondary" data-quick="No — stop there and wait.">No, stop there</button><button class="btn secondary" data-quick="Explain that in more detail first.">Explain more</button></div>
    </div>
    <div class="col"><div class="peek"><div class="ph"><i data-lucide="square-terminal" class="ic"></i>Earlier<button data-toggle-term>Open terminal  t</button></div><div id="peek"><div class="ln">…</div></div></div></div></div>
    <div class="foot"><div class="composer"><textarea id="reply" rows="1" placeholder="Reply to ${esc(c.name)}…">${esc(drafts[c.id] || "")}</textarea>${micBtn("reply")}<button class="send" data-send aria-label="Send" title="Send (Enter)"><i data-lucide="corner-down-left" class="ic"></i></button></div>
    <div class="hint">Enter sends to the agent · Shift+Enter new line · ${S.voice ? "V to speak · " : ""}J/K next agent</div><div class="voice-note" id="vnote" hidden></div></div>`;
  icons(); grow($("#reply")); loadPeek(c); setTimeout(() => $("#reply")?.focus(), 0);
}
async function loadPeek(c) {
  try { const tl = await api(`/api/timeline/${c.id}`); const el = $("#peek"); if (!el || sel !== c.id) return;
    const seen = new Set([c.detail]); const lines = [];
    for (const e of tl.slice().reverse()) { const d = (e.detail || "").trim(); if (!d || seen.has(d)) continue; seen.add(d); lines.push(d); if (lines.length >= 3) break; }
    el.innerHTML = lines.length ? lines.reverse().map(l => `<div class="ln">● ${esc(l)}</div>`).join("") : `<div class="ln">No earlier output.</div>`;
  } catch {}
}
function paneTerm(p, c) {
  p.innerHTML = `${head(c)}<div class="term" id="termBox"><div id="xt"></div><div class="cover" id="cover" hidden></div>${S.voice ? `<button class="mic tmic" data-mic="term" title="Speak into the terminal (V)" aria-label="Speak"><i data-lucide="mic" class="ic"></i></button>` : ""}</div>
    <div class="tbar"><span class="${c.work ? "st-work" : "st-pers"}">${c.work ? "Work · Ritchie" : "Personal · lucerocris"}</span><span>type straight into the agent</span>${S.voice ? "<span>V speaks</span>" : ""}<span>Shift+Esc leaves the terminal</span></div>
    <div class="voice-note" id="vnote" hidden style="padding:0 32px 8px"></div>`;
  icons(); mountTerm(c.id);
}
function paneTodo(p, c) {
  p.innerHTML = `${head(c, false)}<div class="body"><div class="col">
    <div class="bigbox"><textarea id="tprompt" placeholder="What should the agent do?">${esc(noPrompt(c) ? "" : c.detail)}</textarea>${micBtn("tprompt")}</div>
    <div class="row"><button class="btn primary" data-start><i data-lucide="play" class="ic"></i>Start on ${c.work ? "Work" : "Personal"}</button><span class="hint" style="margin:0">Ctrl+Enter starts · in ${esc(c.cwd)}</span></div>
    <div class="voice-note" id="vnote" hidden></div></div></div>`;
  icons();
}
function paneNew(p) {
  const dir = store.get("loft.dir." + newAcct) || S.dirs.find(d => (newAcct === "work") === d.includes("evotech")) || "";
  p.innerHTML = `<div class="new"><div class="row"><button class="ibtn back" data-back aria-label="Back"><i data-lucide="arrow-left" class="ic"></i></button><h1>New task</h1></div>
    <div class="bigbox"><textarea id="nprompt" placeholder="What should an agent do?${S.voice ? " Type, or press V and say it." : ""}">${esc(drafts.new || "")}</textarea>${micBtn("nprompt")}</div>
    <div class="opts"><div class="seg" role="group" aria-label="Account">${[["work", "Work"], ["personal", "Personal"]].map(([k, l]) => `<button data-newacct="${k}" aria-pressed="${newAcct === k}"><span class="dot ${k === "work" ? "work" : "pers"}"></span>${l}</button>`).join("")}</div>
      <label class="folder" title="Project folder"><i data-lucide="folder" class="ic"></i><input id="ndir" list="dirs" value="${esc(dir)}" spellcheck="false" aria-label="Folder"><datalist id="dirs">${S.dirs.map(d => `<option value="${esc(d)}">`).join("")}</datalist></label></div>
    <div class="row"><button class="btn primary" id="nStart"><i data-lucide="play" class="ic"></i>Start</button><button class="btn quiet" id="nTodo">Save to Todo</button><span class="hint" style="margin:0">Ctrl+Enter starts · the title is written for you${S.voice ? ` · say "…start it" at the end to start hands-free` : ""}</span></div>
    <div class="err" id="nerr"></div><div class="voice-note" id="vnote" hidden></div></div>`;
  icons(); setTimeout(() => $("#nprompt")?.focus(), 0);
}
function paneQuiet(p) {
  const v = visible(), run = v.filter(c => c.col === "running").length, todo = v.filter(c => c.col === "todo").length;
  p.innerHTML = `<div class="empty">${MARK("#24272C", "#30343A", "#30343A")}<h2>Nothing needs you</h2>
    <p>${run} working · ${todo} in Todo. You'll get a notification when one comes back.</p>
    <button class="btn secondary" id="newBtn2"><i data-lucide="plus" class="ic"></i>New task</button></div>`;
  icons();
}
function refreshPane(c) {   // light update without rebuilding (keeps drafts, focus, terminal)
  const a = $("#agoLabel"); if (a) a.textContent = ago(c.updated);
  const q = $("#askText"); if (q && c.detail && q.textContent !== c.detail) q.textContent = c.detail;
}
function grow(t) { if (!t) return; t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; }

/* ---------- terminal ---------- */
function mountTerm(id) {
  if (!term) {
    term = new Terminal({ fontFamily: '"Geist Mono", "JetBrains Mono", monospace', fontSize: 13, lineHeight: 1.2, cursorBlink: true, scrollback: 5000,
      theme: { background: "#0F1012", foreground: "#EDEEF0", cursor: "#EDEEF0", selectionBackground: "rgba(91,141,255,.35)", black: "#1C1F23", brightBlack: "#6E737B",
        blue: "#5B8DFF", brightBlue: "#8FB0FF", green: "#46C07D", brightGreen: "#7DD6A4", yellow: "#F2B544", brightYellow: "#F6CB72", red: "#F0685A", brightRed: "#FF8A7D", white: "#C9CDD2", brightWhite: "#FFFFFF" } });
    fit = new FitAddon.FitAddon(); term.loadAddon(fit);
    term.onData(d => { if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
    term.attachCustomKeyEventHandler(e => { if (e.type === "keydown" && e.key === "Escape" && e.shiftKey) { leaveTerm(); return false; } return true; });
  }
  const host = $("#xt"); if (term.element) host.appendChild(term.element); else term.open(host);
  new ResizeObserver(refit).observe($("#termBox"));
  if (wsFor === id && ws && ws.readyState <= 1) { requestAnimationFrame(() => { refit(); term.focus(); }); return; }
  disconnectTerm(); term.reset(); wsFor = id;
  cover(`<div><i data-lucide="loader" class="ic"></i>Opening the session…</div>`);
  const sock = new WebSocket(`ws://${location.host}/ws/term/${id}?t=${TOKEN}`); sock.binaryType = "arraybuffer"; ws = sock;
  sock.onopen = () => { cover(null); requestAnimationFrame(() => { refit(); term.focus(); }); };
  sock.onmessage = e => term.write(new Uint8Array(e.data));
  sock.onclose = () => { if (sock !== ws) return; ws = null; cover(`<div>Session closed<button class="btn secondary" data-reconnect>Reconnect</button></div>`); };
}
function refit() { if (!term || !$("#termBox")) return; try { fit.fit(); } catch {} if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows })); }
function cover(h) { const c = $("#cover"); if (!c) return; if (h) { c.innerHTML = h; c.hidden = false; icons(); } else c.hidden = true; }
function disconnectTerm() { if (ws) { const w = ws; ws = null; try { w.close(); } catch {} } wsFor = null; }
function leaveTerm() { const c = cardOf(sel); if (c && c.col === "needs") { termView[c.id] = false; render(); } else term?.blur(); }
const paste = t => ws && ws.readyState === 1 && ws.send(new TextEncoder().encode("\x1b[200~" + t + "\x1b[201~"));

/* ---------- voice ---------- */
let rec = null, recTarget = null, chunks = [];
async function toggleVoice(target) {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  if (!S.voice) return toast("Voice isn't set up on this machine.", true);
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { return toast("Microphone blocked. Allow it for this window and try again.", true); }
  recTarget = target; chunks = [];
  rec = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); setMic("busy"); note("Transcribing…");
    try {
      const blob = new Blob(chunks, { type: "audio/webm" });
      if (blob.size < 2000) throw new Error("Didn't catch that — hold on a little longer.");
      const { text } = await api("/api/voice", blob, "audio/webm");
      if (!text) throw new Error("Didn't catch any words.");
      deliver(recTarget, text);
    } catch (e) { toast(e.message, true); }
    finally { setMic(""); note(""); rec = null; }
  };
  rec.start(); setMic("rec"); note("Listening… press V or click the mic to stop");
}
function setMic(state) { document.querySelectorAll(`[data-mic]`).forEach(b => { b.classList.toggle("rec", state === "rec"); b.classList.toggle("busy", state === "busy"); }); }
function note(t) { const n = $("#vnote"); if (n) { n.textContent = t; n.hidden = !t; } }
function deliver(target, text) {
  const go = /[,.]?\s*(start it|send it|go ahead and send( it)?)[.!]?$/i;
  const auto = go.test(text); if (auto) text = text.replace(go, "").trim();
  if (target === "term") { paste(text); term?.focus(); return; }
  const el = $("#" + target); if (!el) return;
  el.value = (el.value.trim() ? el.value.trimEnd() + " " : "") + text; el.dispatchEvent(new Event("input", { bubbles: true })); grow(el); el.focus();
  if (auto) { if (target === "nprompt") submitNew(true); else if (target === "reply") sendReply(); else if (target === "tprompt") $("[data-start]")?.click(); }
}
function voiceTarget() { if (sel === "new") return "nprompt"; if ($("#reply")) return "reply"; if ($("#tprompt")) return "tprompt"; if ($("#xt")) return "term"; return null; }

/* ---------- actions ---------- */
async function sendReply(text) {
  const c = cardOf(sel); const box = $("#reply"); text = (text ?? box?.value ?? "").trim(); if (!c || !text) return;
  // Optimistic: clear now (sending takes a few seconds), put the text back if it fails.
  drafts[c.id] = ""; if (box) { box.value = ""; grow(box); }
  toast(`Sending to ${c.name}…`);
  const r = await act(c.id, "reply", { text }, true);
  if (!r) { drafts[c.id] = text; const b2 = $("#reply"); if (b2 && sel === c.id) { b2.value = text; grow(b2); } return; }
  toast(`Sent to ${c.name}`);
  if (sel === c.id) { const next = needsList().find(x => x.id !== c.id); if (next) setSel(next.id); }
}
async function submitNew(start) {
  const prompt = $("#nprompt").value.trim(), cwd = $("#ndir").value.trim();
  if (!prompt) { $("#nerr").textContent = start ? "Say or write what it should do." : "Write something to save."; $("#nprompt").focus(); return; }
  if (!cwd) { $("#nerr").textContent = "Pick the project folder it works in."; $("#ndir").focus(); return; }
  const b = $(start ? "#nStart" : "#nTodo"); b.disabled = true;
  try {
    const r = await api("/api/cards", { prompt, cwd, account: newAcct, start, title: "" });
    store.set("loft.dir." + newAcct, cwd); drafts.new = ""; toast(r.message);
    const m = /started ([0-9a-f]{8})/.exec(r.message || ""); if (m) return waitOpen(m[1]);
    setSel(null);
  } catch (e) { $("#nerr").textContent = e.message; } finally { b.disabled = false; }
}
async function waitOpen(id) { for (let i = 0; i < 12 && !cardOf(id); i++) { try { S = await api("/api/state"); } catch {} await new Promise(r => setTimeout(r, 400)); } setSel(id); }
function openMenu(btn) {
  const c = cardOf(sel); if (!c) return; const m = $("#menu"), running = c.col === "running", todo = c.kind === "todo";
  m.innerHTML = `${!todo ? `<button data-do="pin"><i data-lucide="${c.pinned ? "pin-off" : "pin"}" class="ic"></i>${c.pinned ? "Unpin" : "Pin to top"}</button>` : ""}
    <button data-do="account" ${running ? "disabled title='Stop it first'" : ""}><span class="dot ${c.work ? "pers" : "work"}" style="margin:0 4px"></span>Move to ${c.work ? "Personal" : "Work"}</button>
    ${!todo ? `<button data-do="open"><i data-lucide="app-window" class="ic"></i>Open in Konsole</button>` : ""}
    ${running ? `<button data-do="stop"><i data-lucide="square" class="ic"></i>Stop</button>` : ""}
    <hr><button class="danger" data-do="archive" ${running ? "disabled title='Stop it first'" : ""}><i data-lucide="${todo ? "trash-2" : "archive"}" class="ic"></i><span>${todo ? "Delete" : "Archive"}</span></button>`;
  const r = btn.getBoundingClientRect(); m.style.top = r.bottom + 6 + "px"; m.style.right = (innerWidth - r.right) + "px"; m.hidden = false; icons();
}
const closeMenu = () => { $("#menu").hidden = true; };

/* ---------- render ---------- */
function render() { renderInbox(); renderPane(); const n = S.cards.filter(c => c.col === "needs").length; document.title = n ? `(${n}) loft` : "loft"; }
function notifyNew() {
  const now = new Set(S.cards.filter(c => c.col === "needs").map(c => c.id));
  if (prevNeeds && "Notification" in window && Notification.permission === "granted")
    for (const id of now) if (!prevNeeds.has(id)) { const c = cardOf(id); const n = new Notification(`${c.work ? "Work" : "Personal"} · ${c.name}`, { body: c.detail || "Needs you", tag: id }); n.onclick = () => { window.focus(); setSel(id); }; }
  prevNeeds = now;
}
function move(dir) {
  const ids = [...document.querySelectorAll("#list .item")].map(e => e.dataset.id); if (!ids.length) return;
  let i = ids.indexOf(sel); i = i < 0 ? 0 : Math.max(0, Math.min(ids.length - 1, i + dir)); setSel(ids[i]);
  document.querySelector(`#list [data-id="${ids[i]}"]`)?.scrollIntoView({ block: "nearest" });
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  if (!e.target.closest("#menu") && !e.target.closest("[data-menu]")) closeMenu();
  const t = e.target.closest("button, .item"); if (!t) return;
  if (t.matches(".item")) return setSel(t.dataset.id);
  if (t.dataset.acct !== undefined) { acct = t.dataset.acct; store.set("loft.acct", acct); return render(); }
  if (t.id === "newBtn" || t.id === "newBtn2") return setSel("new");
  if (t.hasAttribute("data-back")) return setSel(null);
  if (t.hasAttribute("data-toggle-done")) { showDone = !showDone; return renderInbox(); }
  if (t.hasAttribute("data-toggle-term")) { const c = cardOf(sel); if (c?.col === "needs") { drafts[c.id] = $("#reply")?.value || ""; termView[c.id] = !termView[c.id]; render(); } return; }
  if (t.hasAttribute("data-quick")) return sendReply(t.dataset.quick);
  if (t.hasAttribute("data-send")) return sendReply();
  if (t.dataset.mic) return toggleVoice(t.dataset.mic);
  if (t.hasAttribute("data-reconnect")) { wsFor = null; ws = null; return mountTerm(sel); }
  if (t.hasAttribute("data-menu")) return $("#menu").hidden ? openMenu(t) : closeMenu();
  if (t.dataset.newacct) { drafts.new = $("#nprompt").value; newAcct = t.dataset.newacct; store.set("loft.newAcct", newAcct); $("#pane").dataset.key = ""; return renderPane(); }
  if (t.id === "nStart") return submitNew(true);
  if (t.id === "nTodo") return submitNew(false);
  if (t.hasAttribute("data-start")) { const p = $("#tprompt").value.trim(); if (!p) { toast("Write or say the prompt first.", true); return; } t.disabled = true; const r = await act(sel, "start", { prompt: p }); t.disabled = false; const m = /started ([0-9a-f]{8})/.exec(r?.message || ""); if (m) waitOpen(m[1]); return; }
  if (t.dataset.do) {
    const a = t.dataset.do;
    if (a === "archive" && !t.classList.contains("armed")) { t.classList.add("armed"); t.querySelector("span").textContent = "Click again to confirm"; return; }
    closeMenu(); const id = sel; const r = await act(id, a); if (r && a === "archive") setSel(null); else { $("#pane").dataset.key = ""; render(); }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "reply") { drafts[sel] = e.target.value; grow(e.target); }
  if (e.target.id === "nprompt") drafts.new = e.target.value;
});
document.addEventListener("focusout", e => {
  const c = cardOf(sel);
  if (e.target.id === "title" && c) { const v = e.target.value.trim(); if (v && v !== c.name) act(c.id, "rename", { name: v }); else e.target.value = c.name; }
  if (e.target.id === "tprompt" && c?.kind === "todo") { const v = e.target.value.trim(); if (v !== (noPrompt(c) ? "" : c.detail)) api(`/api/cards/${c.id}/prompt`, { prompt: v }).catch(() => {}); }
});
document.addEventListener("keydown", e => {
  const ae = document.activeElement, inTerm = ae?.closest?.(".xterm");
  if (inTerm) return;                                  // the terminal owns the keyboard (Shift+Esc leaves)
  const typing = /INPUT|TEXTAREA/.test(ae?.tagName);
  if (ae?.id === "reply" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); return sendReply(); }
  if (ae?.id === "nprompt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); return submitNew(true); }
  if (ae?.id === "tprompt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); return $("[data-start]")?.click(); }
  if (ae?.id === "title" && e.key === "Enter") return ae.blur();
  if (e.key === "Escape") { if (!$("#menu").hidden) return closeMenu(); if (rec?.state === "recording") return rec.stop(); if (typing && ae.id !== "reply") return ae.blur(); if (sel === "new") return setSel(null); return; }
  // V speaks — also while the reply box is empty and focused
  if ((e.key === "v" || e.key === "V") && !e.ctrlKey && !e.metaKey && !e.altKey && (!typing || (ae.id === "reply" && !ae.value) || (ae.id === "nprompt" && !ae.value))) { const tg = voiceTarget(); if (tg) { e.preventDefault(); return toggleVoice(tg); } }
  if (typing && !((ae.id === "reply" || ae.id === "nprompt") && !ae.value)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "n") { e.preventDefault(); setSel("new"); }
  else if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "t") { const c = cardOf(sel); if (c?.col === "needs") { e.preventDefault(); termView[c.id] = !termView[c.id]; render(); } else if (term) { e.preventDefault(); term.focus(); } }
});

/* ---------- live data ---------- */
function apply(s) { S = s; loaded = true; notifyNew(); render(); }
api("/api/state").then(apply).catch(e => toast(e.message, true));
if (!new URL(location.href).searchParams.has("nosse")) { const es = new EventSource(`/api/events?t=${TOKEN}`); es.onmessage = m => apply(JSON.parse(m.data)); }
setInterval(() => { if (loaded) renderInbox(); }, 30000);
</script>
</body>
</html>
